# Added after the generated settings by grmt/wp-plugin-ci quality.yml.
sonar.sources=.
sonar.exclusions=vendor/**,node_modules/**,dist/**,languages/**

# Sonar's naming rules (functions, classes, fields) only accept PSR names; the code follows
# WordPress naming (AVPVH_AT_*, snake_case methods), which grmt/wp-plugin-ci checks instead.
# As in avpvh-members, avpvh-filelist and avpvh-bookkeeping.
sonar.issue.ignore.multicriteria=wpfn,wpcls,wpfld
sonar.issue.ignore.multicriteria.wpfn.ruleKey=php:S100
sonar.issue.ignore.multicriteria.wpfn.resourceKey=**/*.php
sonar.issue.ignore.multicriteria.wpcls.ruleKey=php:S101
sonar.issue.ignore.multicriteria.wpcls.resourceKey=**/*.php
sonar.issue.ignore.multicriteria.wpfld.ruleKey=php:S116
sonar.issue.ignore.multicriteria.wpfld.resourceKey=**/*.php
