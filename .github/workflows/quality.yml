name: "CI"

on:
  push:
    branches: "*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  php-version: 8.3
  node-version: 24.16.0
  cache-version: 1

jobs:
  platform-check:
    name: "PHP 8.1 compatibility"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout"
        uses: actions/checkout@v7

      - name: "Setup PHP"
        uses: shivammathur/setup-php@2.40.0
        with:
          php-version: 8.1
          coverage: none

      - name: "Check dependency compatibility"
        run: composer check-platform-reqs --lock --no-dev

  build:
    name: "Build"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout"
        uses: actions/checkout@v7

      - name: "Setup Node.js"
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.node-version }}

      - name: "Build clean plugin package"
        run: npm run build:plugin

      - name: "Upload artifact"
        uses: actions/upload-artifact@v7
        with:
          name: "build-artifact"
          path: dist

  lint:
    name: "Lint"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout"
        uses: actions/checkout@v7

      - name: "Setup PHP"
        uses: shivammathur/setup-php@2.40.0
        with:
          php-version: ${{ env.php-version }}
          coverage: none
          tools: composer:v2

      - name: "Cache Composer dependencies"
        uses: actions/cache@v6
        with:
          path: "~/.composer/cache"
          key: composer-dependencies-${{ runner.os }}-${{ env.cache-version }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-dependencies-${{ runner.os }}-${{ env.cache-version }}-

      - name: "Install Composer dependencies"
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: "Validate Composer metadata"
        run: composer validate --strict

      - name: "Check PHP syntax"
        run: find . -path ./vendor -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: "Check WordPress Coding Standards"
        run: composer check

      - name: "Setup Node.js"
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.node-version }}

      - name: "Check JavaScript syntax"
        run: npm run check

  plugin-check:
    name: "Plugin check"
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: "Download build artifact"
        uses: actions/download-artifact@v8
        with:
          name: "build-artifact"
          path: dist

      - name: "Run official Plugin Check"
        uses: WordPress/plugin-check-action@v1
        with:
          build-dir: dist/avpvh-audio-transcriptie
          ignore-codes: |
            missing_composer_json_file
