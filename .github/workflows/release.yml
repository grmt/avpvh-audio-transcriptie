name: "Release"

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  ci:
    name: "CI"
    uses: ./.github/workflows/CI.yml
    permissions:
      contents: read
      id-token: write
    secrets: inherit

  release:
    name: "Publish release ZIP"
    runs-on: ubuntu-latest
    needs: ci
    permissions:
      contents: write
    steps:
      - name: "Download build artifact"
        uses: actions/download-artifact@v8
        with:
          name: build-artifact
          path: avpvh-audio-transcriptie

      - name: "Build avpvh-audio-transcriptie.zip"
        run: |
          zip -r -q avpvh-audio-transcriptie.zip avpvh-audio-transcriptie
          ls -lh avpvh-audio-transcriptie.zip

      - name: "Upload ZIP"
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v7
        with:
          name: avpvh-audio-transcriptie
          path: avpvh-audio-transcriptie.zip

      - name: "Publish GitHub release"
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" avpvh-audio-transcriptie.zip --clobber
          else
            gh release create "${TAG}" avpvh-audio-transcriptie.zip \
              --title "AVPVH Audio Transcriptie ${TAG}" \
              --generate-notes
          fi
